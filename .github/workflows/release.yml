---
name: Release

on: workflow_dispatch

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package macOS
    # macOS 26 is required: the macos-15 image tops out at Xcode 26.3 / Swift
    # 6.2.3, which cannot parse this package's swift-tools-version: 6.3.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          install_args: swift
          cache: false
      - run: mise run package-release
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xclint-macos-universal
          path: dist/*.tar.gz
          if-no-files-found: error
